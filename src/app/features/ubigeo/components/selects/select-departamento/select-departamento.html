<p-select 
    panelStyleClass="text-[.875rem]!"
    size="small" 
    [loading]="loading()" 
    fluid 
    [options]="ubigeoDepartamentos" 
    [formControl]="control" 
    [invalid]="invalid" 
    [readonly]="readonly" 
    optionLabel="departamento" 
    optionValue="id" 
    [class]="invalid ? 'min-h-9! shadow-none! border-primary-400! focus:border-primary-400!' : 'min-h-9! shadow-none! focus:border-gray-500! hover:border-gray-400! hover:shadow-xs!'" 
    [placeholder]="loading() ? placeholderLoading : placeholder" 
    [filter]="true" 
    appendTo="body"
    [inputId]="inputId"
></p-select>
