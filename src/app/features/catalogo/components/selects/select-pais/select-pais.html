<p-select 
panelStyleClass="text-[.875rem]! uppercase!"
size="small" 
[loading]="loading()" 
fluid 
[options]="data" 
[formControl]="control" 
[invalid]="invalid" 
optionLabel="pais" 
[optionValue]="optionValue" 
[class]="invalid ? 'min-h-9! shadow-none! border-primary-400! focus:border-primary-400!' : 'min-h-9! shadow-none! focus:border-gray-500! hover:border-gray-400! hover:shadow-xs!'" 
[placeholder]="loading() ? placeholderLoading : placeholder" 
[filter]="true" 
appendTo="body"
[inputId]="inputId"></p-select>
