@if(label){<label [attr.class]="classLabel">{{ label }}</label>}
<p-select 
    panelStyleClass="text-[.875rem]!"
    size="small" 
    fluid 
    [options]="data()"
    [loading]="ldData()" 
    [formControl]="control"  
    optionLabel="descripcion" 
    optionValue="id"  
    class="p-inputwrapper-filled" 
    placeholder="--SELECCIONAR--"
    appendTo="body"
    [invalid]="invalid"
>

        <div class="flex items-center">
            {{item.descripcion}}
        </div>
    </ng-template>-->
</p-select>
