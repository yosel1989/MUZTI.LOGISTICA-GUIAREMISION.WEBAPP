<div class="flex flex-col">
    @if(loading()){
        <p-skeleton class="w-full" height="105px"></p-skeleton> 
    }@else{
        <p-select 
            [loading]="loading()" 
            fluid 
            (onChange)="onSelectItem($event)"
            [options]="data" 
            [formControl]="control" 
            [invalid]="invalid" 
            optionLabel="empresa"
            optionValue="ruc" 
            filterBy="ruc,empresa"
            [class]="invalid ? 'min-h-9! shadow-none! border-primary-400! focus:border-primary-400! rounded-lg!' : 'min-h-[105px]! shadow-none! focus:border-gray-500! hover:border-gray-400! hover:shadow-xs! rounded-lg!' " 
            [placeholder]="loading() ? placeholderLoading : placeholder" 
            [filter]="true" 
            appendTo="body"
            [inputId]="inputId"
            [virtualScrollItemSize]="600",
            [overlayOptions]="{ 
                
                responsive: {
                    breakpoint: '960px',
                    media: '(max-width: 960px)',
                    direction: 'center',
                    style: { backgroundColor: '#fff', borderRadius: '8px' },
                    styleClass: 'overlay-mobil',
                    contentStyle: { padding: '1rem' },
                },
            }"
        >
            <ng-template #selectedItem let-selectedOption>
                <div class="p-4 text-left">
                    <div class="flex flex-row gap-x-4">
                        <p-avatar icon="fa-duotone fa-solid fa-briefcase" class="bg-primary-100! text-primary!" size="large"></p-avatar>
                        <div>
                            <p class="font-semibold">{{ selectedOption.empresa }}</p>
                            <p class="uppercase">{{ selectedOption.ruc }}</p>
                        </div>
                    </div>
                </div>
            </ng-template>
            <ng-template let-item #item>
                <div class="flex flex-row gap-x-4">
                    <p-avatar icon="fa-light fa-briefcase" class="bg-primary-100! text-primary!" size="large"></p-avatar>
                    <div>
                        <p class="font-semibold">{{ item.empresa }}</p>
                        <p class="uppercase">{{ item.ruc }}</p>
                    </div>
                </div>
            </ng-template>
            <ng-template #emptyfilter>
                <div class="flex flex-row gap-x-4">
                    <p-avatar icon="fa-light fa-briefcase" class="bg-primary-100! text-primary!" size="large"></p-avatar>
                    <div>
                        <p class="uppercase">Seleccionar empresa</p>
                    </div>
                </div>
            </ng-template>
        </p-select>
    }
</div>
