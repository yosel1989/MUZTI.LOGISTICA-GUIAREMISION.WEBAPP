<div class="p-4">
    <div class="flex flex-col gap-4">
        <div class="lg:col-span-2">
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input 
                    [formControl]="ctrlSearch" 
                    pSize="small" 
                    fluid 
                    type="text" 
                    pInputText 
                    placeholder="Filtrar"
                    class="min-h-9!"
                />
            </p-iconfield>
        </div>
    </div>

    <div class="mt-5 border rounded-xl border-slate-200 overflow-hidden">
        <p-table
            size="small"
            [columns]="cols"
            showGridlines
            [value]="data()"
            [(selection)]="selected"
            selectionMode="single"
            [tableStyle]="{ 'min-width': '100px' }"
            [scrollable]="true"
            [showLoader]="true"
            [loading]="ldSelected() || ldDataById()"

            [metaKeySelection]="true"
            dataKey="id"
        
            [lazy]="true"
            [rowHover]="true"
            scrollHeight="400px"
            class="border-0! text-[12px]!"

            [loading]="ldData()"
            [paginator]="true"
            [totalRecords]="totalRecords()" 
            [rows]="pageSize()"
            [first]="first()" 
            paginatorDropdownAppendTo="body"
            paginatorStyleClass="text-[12px]! p-paginator-xs border-t-[.5px]! border-t-gray-300! rounded-none! py-3!"
        >
            
                <ng-template pTemplate="header" let-columns>
                        <tr>
                            @for (col of columns; track $index) {
                                <th 
                                    class="text-nowrap text-[14px]! text-primary-500! font-semibold py-4! px-4! roboto-condensed border-t-0!"
                                    [ngClass]="col.thClassName"
                                    [class.border-e-0!]="($index === columns.length - 1)"
                                    [class.border-s-0!]="$index === 0"
                                >
                                    {{ col.header }}
                                </th>
                            }
                        </tr>
                </ng-template>

                <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
                    @if(ldData()){
                        <tr>
                            @for (col of columns; track $index) {
                                <td
                                    [class.border-e-0!]="($index === columns.length - 1)"
                                    [class.border-s-0!]="$index === 0"
                                    [class.border-b-0!]="(rowIndex === data().length - 1)"
                                >
                                    <p-skeleton [width]="$index == 0 ? '20px' : '100%'" height="20px"></p-skeleton>
                                </td>
                            }
                        </tr>
                    }@else {
                        <tr 
                            [pSelectableRow]="rowData" 
                            (dblclick)="evtSelect()"
                            [class.p-datatable-contextmenu-row-selected]="selected === rowData"
                        >
                            @for (col of columns; track $index) {
                                <td 
                                    class="text-nowrap font-light! truncate"
                                    [class.border-e-0!]="($index === columns.length - 1)"
                                    [class.border-s-0!]="$index === 0"
                                    [class.border-b-0!]="(rowIndex === data().length - 1)"
                                    [ngClass]="col.tdClassName"
                                    [innerHTML]="!rowData['ld_update'] ? (col.render ? col.render(rowData) : rowData[col.field] ) : ''"
                                ></td>
                            }
                        </tr>
                    }
                </ng-template>

                <ng-template #emptymessage >
                    <tr>
                        <td [colSpan]="cols.length" class="border-x-0! border-y-0!">
                            No se encontraron registros.
                        </td>
                    </tr>
                </ng-template>
        </p-table>
    </div>
</div>

<div class="flex gap-2 justify-end p-4">
    <p-button (click)="evtOnClose()" size="small" label="Cancelar" severity="secondary" styleClass="text-[12px]!"></p-button>
    <p-button (click)="evtSelect()" styleClass="min-w-[100px]! text-[12px]!" [loading]="ldDataById() || ldSelected()" [disabled]="!selected" size="small" [label]="ldSelected() ? '' : 'Seleccionar'" severity="primary"></p-button>
</div>
