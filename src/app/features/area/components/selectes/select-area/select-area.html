<p-select 
    panelStyleClass="text-[.875rem]! uppercase!"
    size="small" 
    fluid 
    [options]="data()" 
    [formControl]="control"  
    [optionLabel]="optionLabel()"  
    [optionValue]="optionValue()"
    [loading]="loading()"
    class="p-inputwrapper-filled" 
    [placeholder]="placeholder()"
    [invalid]="invalid()"
    appendTo="body"
></p-select>
