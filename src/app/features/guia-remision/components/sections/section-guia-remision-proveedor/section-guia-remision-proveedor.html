<div class="flex flex-col gap-x-4 gap-y-2 p-4 pt-8!">

        <div class="flex flex-col gap-y-3">

            @if(submitted() && invalid){
                <p class="inline-flex items-center text-sm! font-medium! text-amber-600! py-1 px-3 rounded-lg! bg-amber-100! border-s-3! border-amber-500!"><i class="fa-regular fa-triangle-exclamation text-lg! me-3"></i> Debe seleccionar un proveedor. </p>
            }

            @if(proveedor){
                <div class="flex flex-row items-center px-4! py-4! rounded-xl! bg-slate-100/60" >

                       

                    <div class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-y-2 gap-x-3">
                            <div>
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">Tipo Documento</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.tipo_documento" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div>
                            <div>
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">N° Documento</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.numero_documento" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div> 
                            <div class="lg:col-span-2">
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">Nombre o Razón Social</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.razon_social" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div> 
                            <div>
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">Dirección</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.direccion" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div> 
                            <div>
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">Departamento</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.departamento" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div>
                            <div>
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">Provincia</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.provincia" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div>
                            <div>
                                <label class="text-[13px]! font-medium text-slate-500 roboto-condensed">Distrito</label>
                                <div class="bg-slate-200 rounded-lg! text-[.875rem] py-2 ps-3">
                                    <app-typing [text]="proveedor.distrito" class="font-semibold! text-slate-600!"></app-typing>
                                </div>
                            </div>
                    </div>

                    <div class="w-12.5 text-end flex flex-col items-center gap-y-2">
                        <p-button 
                            [outlined]="true"
                            pTooltip="Quitar proveedor" 
                            tooltipPosition="left" 
                            tooltipStyleClass="text-[10px]!" 
                            class="text-xs! ml-auto" 
                            size="small" 
                            icon="pi pi-times text-xs! font-semibold!" 
                            styleClass=" text-xs! bg-primary-100! hover:border-primary-100! hover:bg-primary-500! hover:text-primary-100!" 
                            (click)="evtRemoveProveedor()"  
                            rounded="true" 
                        />
                    </div>

                </div> 
            }@else {
                <div class="flex flex-row items-center">
                    <p-button 
                        [outlined]="true" 
                        (onClick)="evtOnShowListaProveedor()" 
                        size="small" 
                        styleClass="text-sm! bg-primary-100! hover:border-primary-100! hover:bg-primary-500! hover:text-primary-100! h-9!" 
                        icon="fa-regular fa-user-tag text-lg!" 
                        severity="primary" 
                        label="Seleccionar proveedor" 
                    ></p-button>
                </div>
            }

        </div>


</div>





<p-confirmdialog styleClass="max-w-[400px]" #cd>
    <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
        <div class="flex flex-col items-center p-8  rounded-xl">
            <div class="rounded-full bg-blue-200 text-blue-700 inline-flex justify-center items-center h-24 w-24 -mt-20"
            >
                <i class="font-bold pi pi-question text-5xl!"></i>
            </div>
            <span class="font-semibold text-xl block mb-2 mt-6 text-center">{{ message.header }}</span>
            <p class="mb-0 text-xs">{{ message.message }}</p>
            <div class="flex items-center gap-2 mt-6">
                <p-button label="Aceptar" (onClick)="onAccept()" styleClass="w-32"></p-button>
                <p-button label="Cancelar" severity="secondary" (onClick)="onReject()" styleClass="w-32"></p-button>
            </div>
        </div>
    </ng-template>
</p-confirmdialog>
