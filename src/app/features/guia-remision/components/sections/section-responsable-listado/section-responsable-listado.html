<p-card>

    <div class="inline-flex items-center gap-2 text-primary mb-4">
        <p class="text-[12px]! font-semibold">Asignar responsables</p>
        @if(submitted && form.invalid) {
            <ng-icon name="tablerAlertCircle" />
        }
    </div>

    <form [formGroup]="form" (ngSubmit)="evtOnSubmit()" class="flex flex-col gap-4">
        <div formArrayName="items">
            <p-table
            [value]="items.controls"
            size="small"
            [rowHover]="true"
            >

                <!-- 👇 Cabecera -->
                <ng-template pTemplate="header">
                    <tr>
                        <th class="text-xs text-gray-500! font-semibold px-1!">#</th>
                        <th class="text-xs text-gray-500! font-semibold w-25 px-1!">Nombre</th>
                        <th class="text-xs text-gray-500! font-semibold align-middle! px-1!">Cargo</th>
                        <th class="text-xs text-gray-500! font-semibold px-1!"></th>
                    </tr>
                </ng-template>

                <!-- 👇 Cuerpo -->
                <ng-template pTemplate="body" let-row let-i="rowIndex">
                    <tr [formGroupName]="i">
                        <td class="text-xs! font-semibold text-gray-500!">{{ i + 1 }}</td>
                        <td class="px-1! w-30!">
                            <input 
                            class="min-h-9 shadow-none! focus:border-gray-500! hover:border-gray-400! hover:shadow-xs!" 
                            pSize="small" 
                            fluid 
                            formControlName="nombre" 
                            pInputText />
                        </td>
                        <td class="px-1! w-30!">
                            <input 
                            class="min-h-9 shadow-none! focus:border-gray-500! hover:border-gray-400! hover:shadow-xs!" 
                            pSize="small" 
                            fluid 
                            formControlName="cargo" 
                            pInputText />
                        </td>
                        <td class="px-1! w-12.5">
                            <div class="flex flex-row gap-1 justify-end">
                                <p-button 
                                    [outlined]="true"
                                    pTooltip="Quitar producto" 
                                    tooltipPosition="left" 
                                    tooltipStyleClass="text-[10px]!" 
                                    class="text-xs!" 
                                    size="small" 
                                    icon="pi pi-trash text-xs! font-semibold!" 
                                    styleClass=" text-xs! bg-primary-100! hover:border-primary-100! hover:bg-primary-500! hover:text-primary-100!" 
                                    (click)="evtRemoveItems(i)"  
                                    rounded="true" 
                                />
                            </div>
                        </td>
                    </tr>
                </ng-template>

            </p-table>
        </div>

       <div class="text-center">
            <p-button 
            [outlined]="true"
            (click)="evtAddPersonal()"
            size="small" 
            styleClass="text-xs! bg-primary-100! hover:border-primary-100! hover:bg-primary-500! hover:text-primary-100!" 
            class="text-xs!" 
            icon="pi pi-plus text-xs!" 
            severity="primary" 
            label="Agregar responsable"></p-button>
        </div>
    </form>


</p-card>
