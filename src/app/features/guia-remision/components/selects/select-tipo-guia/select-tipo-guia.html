@if(label){ <label [attr.class]="classLabel">{{ label }}</label> }
<p-select 
    panelStyleClass="text-[.875rem]! uppercase"
    size="small" 
    fluid [options]="data" 
    [formControl]="frmCtrlTipoGuia"  
    optionLabel="label" 
    optionValue="value" 
    class="p-inputwrapper-filled" 
    [inputId]="inputId"
    placeholder="--SELECCIONAR--"
    appendTo="body"
></p-select>
