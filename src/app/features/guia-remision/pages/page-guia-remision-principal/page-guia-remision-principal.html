<div class="container-fluid p-4 pb-0! relative mx-auto" @fadeDown>

    <div class="flex items-center justify-between mb-4">
        <h1 class="inline-flex items-center md:text-md! lg:text-xl! font-semibold! text-slate-500 roboto-condensed">
            <span class="block w-[3px]! h-[30px]! rounded-xl! bg-slate-500 me-3"></span>
            Administración de guías de remisión
        </h1>
        <p-button size="small" severity="primary" icon="pi pi-plus" label="Nueva guía de remisión" [routerLink]="['nuevo']"></p-button>
    </div>

    <div class="rounded-2xl! overflow-hidden! border border-gray-200!">
        <app-flt-guia-remision-principal #fltGuiaRemision [collapsed]="collapseFilter()"></app-flt-guia-remision-principal>
    </div>
</div>

<div class="container-fluid p-4 relative mx-auto" @fadeDown>
    <div class="rounded-2xl! overflow-hidden! border border-gray-200!">
        <app-tbl-guia-remision-principal #table [filter]="fltGuiaRemision" (OnShowFilter)="evtShowFilter()"></app-tbl-guia-remision-principal>
    </div>
</div>
