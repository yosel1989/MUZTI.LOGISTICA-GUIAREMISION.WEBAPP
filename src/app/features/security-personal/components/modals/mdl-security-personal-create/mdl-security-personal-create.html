<form [formGroup]="frm" (ngSubmit)="evtOnSubmit()">

    <div class="grid grid-cols-1 px-4">
        
        
        <div class="grid grid-cols-2 gap-3 py-10!">

            <div class="col-span-2">
                <label class="text-[11px]! h-4.5! text-gray-500 font-semibold">N° Documento</label>
                <input 
                    fluid 
                    onlyUpper 
                    pInputText 
                    type="text" 
                    pSize="small" 
                    class="shadow-none! min-h-9! focus:border-gray-500! hover:border-gray-400! hover:shadow-xs!"
                    formControlName="document_number" 
                    [invalid]="frm.get('document_number')?.invalid && (frm.get('document_number')?.touched || isSubmitted())"
                />
                @if (frm.get('document_number')?.invalid && (frm.get('document_number')?.touched || isSubmitted())) {
                    <p-message severity="error" size="small" variant="simple" >
                    <span class="text-[10px]! ">
                        @if (f.document_number.hasError('required')) {
                            Este campo es requerido.
                        }
                    </span>
                    </p-message>
                }
            </div>
        </div>
        
        
    </div>

    <div class="flex justify-end gap-2">
        <p-button styleClass="w-[92px]!" type="reset" icon="pi pi-times" size="small" label="Cancelar" severity="secondary" (click)="evtOnClose()"/>
        <p-button styleClass="w-[92px]!" type="submit" icon="pi pi-save" size="small" [label]="ldSubmit() ? '' : 'Guardar'" [loading]="ldSubmit()" severity="primary" />
    </div>

</form>





<div class="card flex justify-center">

    <p-confirmdialog styleClass="max-w-[400px]! rounded-3xl!" #cd appendTo="body">
        <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
            <div class="flex flex-col items-center p-8 rounded-xl">
                <div
                    class="rounded-full bg-primary text-primary-contrast inline-flex justify-center items-center h-24 w-24 -mt-20"
                >
                    <i class="pi pi-question text-5xl!"></i>
                </div>
                <span class="font-semibold text-2xl block mb-2 mt-6">{{ message.header }}</span>
                <p class="mb-0">{{ message.message }}</p>
                <div class="flex items-center gap-2 mt-6">
                    <p-button label="Aceptar" (onClick)="onAccept()" styleClass="w-32"></p-button>
                    <p-button label="Cancelar" [outlined]="true" (onClick)="onReject()" styleClass="w-32"></p-button>
                </div>
            </div>
        </ng-template>
    </p-confirmdialog>
</div>
