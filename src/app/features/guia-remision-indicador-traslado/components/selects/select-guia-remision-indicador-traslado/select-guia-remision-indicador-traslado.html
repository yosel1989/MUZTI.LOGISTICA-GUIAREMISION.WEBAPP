@if(label){<label [attr.class]="classLabel">{{ label }}</label>}
<p-select 
    panelStyleClass="text-[.875rem]!"
    size="small" 
    fluid 
    [options]="data()"
    [loading]="ldData()" 
    [formControl]="control"  
    optionLabel="name" 
    optionValue="id"  
    class="p-inputwrapper-filled min-h-9!" 
    placeholder="--SELECCIONAR--"
    appendTo="body"
    [invalid]="invalid"
    [checkmark]="true"
>
</p-select>
